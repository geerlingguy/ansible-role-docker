---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 7 * * 0"

defaults:
  run:
    working-directory: 'geerlingguy.docker'

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: 'geerlingguy.docker'

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # Can't go to 3.14+ until Ansible 13.x

      - name: Install test dependencies.
        run: pip3 install yamllint

      - name: Lint code.
        run: |
          yamllint .

  molecule:
    name: Molecule
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
        distro:
          - fedora43
          - opensuseleap15

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: 'geerlingguy.docker'

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # Can't go to 3.14+ until Ansible 13.x

      - name: Install test dependencies.
        run: pip3 install ansible molecule molecule-plugins[docker] docker

      - name: Load legacy iptables modules.
        run: sudo modprobe -a ip_tables iptable_nat iptable_filter && lsmod | grep -E 'ip_tables|iptable_'

      - name: Run Molecule tests.
        run: molecule test --destroy never
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}

      - name: Debug Docker failure.
        if: failure()
        run: |
          docker version
          uname -r
          lsmod | grep -E 'ip_tables|iptable_|nf_tables|nft_|xt_|br_netfilter|overlay' || true
          docker exec instance sh -c 'iptables --version; systemctl status docker containerd --no-pager -l; journalctl -u docker -u containerd --no-pager | tail -80'
