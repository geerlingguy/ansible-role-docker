---
# Used only for Fedora/Rocky (RedHat OS-Family)
# https://docs.docker.com/engine/install/fedora/#uninstall-old-versions
# https://docs.docker.com/engine/install/centos/#uninstall-old-versions

docker_obsolete_packages:
  - docker
  - docker-client
  - docker-client-latest
  - docker-common
  - docker-latest
  - docker-latest-logrotate
  - docker-logrotate
  - docker-engine

docker_rootless_prerequisite_packages:
  - shadow-utils
  - iproute
  - procps-ng

docker_rootless_capability_packages:
  - libcap

docker_rootless_network_packages:
  slirp4netns:
    - slirp4netns
  pasta:
    - passt
  gvisor-tap-vsock: []
