---
# Used only for openSUSE / SLES (SUSE OS-Family)
# https://en.opensuse.org/Docker
# https://docs.docker.com/engine/install/binaries/

# Packages to remove if present (old or conflicting Docker packages)
docker_obsolete_packages:
  - docker-engine
  - docker.io
  - docker-ce
  - docker-ce-cli
  - docker-buildx-plugin
  - docker-ce-rootless-extras
  - containerd.io

# Packages to install on openSUSE / SLES
# Use 'runc' from repo, not 'docker-runc' (avoids conflicts on Leap 15.6)
docker_packages:
  - docker
  - containerd
  - runc

# Map SUSE releases to Docker repository paths.
#
# As of 2024, download.opensuse.org/repositories/Virtualization:/containers/
# uses numeric version paths (e.g. 15.5, 15.6, 15.7, 16.0) that match
# ansible_facts.distribution_version directly for all Leap/SLES 15.x+ releases.
# Only Tumbleweed and legacy SLES 12 SP5 require explicit mapping.
docker_suse_release: >-
  {%- if 'Tumbleweed' in ansible_facts.distribution -%}
    openSUSE_Tumbleweed
  {%- elif ansible_facts.distribution_version is match('12\\.5') -%}
    SLE_12_SP5
  {%- else -%}
    {{ ansible_facts.distribution_version }}
  {%- endif -%}

# Official Docker repo URL for openSUSE Leap
docker_zypper_repo_url: >-
  https://download.opensuse.org/repositories/Virtualization:/containers/{{ docker_suse_release | trim }}/

# Control whether to add the Docker repository
docker_add_repo: true

docker_rootless_prerequisite_packages:
  - docker-rootless-extras

docker_rootless_capability_packages:
  - libcap-progs

docker_rootless_network_packages:
  slirp4netns:
    - slirp4netns
  pasta:
    - passt
  gvisor-tap-vsock: []
